[package]
name = "yt-signaling-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
yt-session-core = { path = "../session-core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = "0.3"
serde_json = "1"
